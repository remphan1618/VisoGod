name: Build and Push VisoMaster Docker Image

on:
  push:
    branches:
      - main # Trigger on push to the main branch
    # Optionally trigger on tag creation for releases
    # tags:
    #   - 'v*'
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for pushing to Docker Hub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Ensure submodules are checked out if VisoMaster uses them
        # with:
        #   submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Build context is the repository root
          file: ./visomaster_deploy_Dockerfile # Path to the Dockerfile
          push: true # Push the image to Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/visomaster:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/visomaster:${{ github.sha }} # Tag with commit SHA
          # Enable build cache for faster builds (optional)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass build arguments if needed (though most are set via ARG in Dockerfile)
          # build-args: |
          #   SOME_ARG=value