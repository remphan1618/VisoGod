# Alternative supervisord config integrating with Vast.ai Instance Portal pattern
# Requires Caddy and potentially wrapper scripts (assumed to be in /opt/supervisor-scripts/)
# See documentation for Pros/Cons (centralized access vs. complexity).

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
# Use environment variables set by Vast.ai or docker-compose
environment=PORTAL_CONFIG="%(ENV_PORTAL_CONFIG)s", OPEN_BUTTON_TOKEN="%(ENV_OPEN_BUTTON_TOKEN)s"

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- Caddy Server Program (for Instance Portal) ---
; Assumes Caddy is installed (e.g., via Dockerfile) and Caddyfile is present
; See Vast.ai base images or Caddy docs: https://caddyserver.com/docs/
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
directory=/etc/caddy
priority=5
autostart=true
autorestart=true
stdout_logfile=/var/log/portal/caddy.log
stderr_logfile=/var/log/portal/caddy_err.log
user=root

; --- Xvfb (Virtual Framebuffer) Program ---
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x1024x24
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log
user=root

; --- Fluxbox Window Manager Program ---
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log
user=root

; --- X11VNC Server Program ---
; May be wrapped by a script in Vast.ai templates to integrate with Portal auth/config
; Example using a hypothetical wrapper script:
; command=/opt/supervisor-scripts/start-vnc.sh
; Using direct command for illustration:
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -listen 127.0.0.1 -rfbport 5901
; Listen on localhost only; Caddy will proxy external access
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/portal/x11vnc.log ; Log to portal directory
stderr_logfile=/var/log/portal/x11vnc_err.log
user=root

; --- VisoMaster Application Program ---
; May also be wrapped by a script for portal integration
; Example using direct command:
[program:visomaster_app]
command=conda run --no-capture-output -n visomaster python main.py --output_dir /workspace/output --image_dir /workspace/Images --video_dir /workspace/Video
directory=/app/VisoMaster
priority=100
autostart=true
autorestart=true
stdout_logfile=/var/log/portal/visomaster_app.log ; Log to portal directory
stderr_logfile=/var/log/portal/visomaster_app_err.log
stopsignal=INT
stopwaitsecs=30
user=root
environment=CONDA_DEFAULT_ENV="visomaster",PATH="/opt/conda/envs/visomaster/bin:/opt/conda/bin:%(ENV_PATH)s"