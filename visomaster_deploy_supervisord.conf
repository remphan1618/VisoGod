[supervisord]
nodaemon=true                   ; Run supervisord in the foreground
logfile=/var/log/supervisor/supervisord.log ; Main log file
pidfile=/var/run/supervisord.pid ; PID file
loglevel=info                   ; Set log level (debug, info, warn, error, critical)

[unix_http_server]
file=/var/run/supervisor.sock   ; Path to the supervisor socket file

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; Connection url for supervisorctl

; --- Xvfb (Virtual Framebuffer) Program ---
; Provides a virtual display for GUI applications if no physical display is present.
; See documentation for the role of VNC/GUI components.
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x1024x24
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log
user=root ; Typically run as root

; --- Fluxbox Window Manager Program ---
; Provides basic window management for the GUI applications within Xvfb.
; See documentation for the role of VNC/GUI components.
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log
user=root ; Or a non-root user if configured

; --- X11VNC Server Program ---
; Shares the Xvfb display over VNC protocol.
; See documentation for the role of VNC/GUI components.
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5901
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log
user=root ; Or a non-root user

; --- VisoMaster Application Program ---
; Runs the main application within the activated Conda environment.
; Adjust 'command' based on how VisoMaster is started (e.g., python main.py).
; See documentation for application startup details.
[program:visomaster_app]
command=conda run --no-capture-output -n visomaster python main.py --output_dir /workspace/output --image_dir /workspace/Images --video_dir /workspace/Video
; Ensure the command uses paths within /workspace for persistent output.
directory=/app/VisoMaster ; Set the working directory for the application
priority=100
autostart=true
autorestart=true ; Or 'unexpected' depending on desired behavior
stdout_logfile=/var/log/supervisor/visomaster_app.log
stderr_logfile=/var/log/supervisor/visomaster_app_err.log
stopsignal=INT
stopwaitsecs=30
user=root ; Or a non-root user if permissions allow
environment=CONDA_DEFAULT_ENV="visomaster",PATH="/opt/conda/envs/visomaster/bin:/opt/conda/bin:%(ENV_PATH)s" ; Ensure conda env is in PATH